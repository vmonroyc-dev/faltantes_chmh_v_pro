const API_USUARIOS = {
    async login(user, pass) {
        try {
            const r = await fetch(`${CONFIG.GOOGLE_SHEETS_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
            return await r.json();
        } catch(e) {
            return { success: false, error: 'Sin conexión' };
        }
    },
    async obtener(solicitante) {
        try {
            const r = await fetch(`${CONFIG.GOOGLE_SHEETS_URL}?action=obtenerUsuarios&solicitante=${encodeURIComponent(solicitante)}`);
            return await r.json();
        } catch(e) {
            return { success: false, error: 'Sin conexión' };
        }
    },
    async crear(solicitante, nuevoUser, nuevoPass) {
        try {
            const r = await fetch(CONFIG.GOOGLE_SHEETS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'crearUsuario', solicitante, nuevoUser, nuevoPass })
            });
            return await r.json();
        } catch(e) {
            return { success: false, error: 'Sin conexión' };
        }
    },
    async cambiarPass(user, passActual, passNueva) {
        try {
            const r = await fetch(CONFIG.GOOGLE_SHEETS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'cambiarPass', user, passActual, passNueva })
            });
            return await r.json();
        } catch(e) {
            return { success: false, error: 'Sin conexión' };
        }
    },
    async eliminar(solicitante, targetUser) {
        try {
            const r = await fetch(CONFIG.GOOGLE_SHEETS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'eliminarUsuario', solicitante, targetUser })
            });
            return await r.json();
        } catch(e) {
            return { success: false, error: 'Sin conexión' };
        }
    }
};

// ========== API ==========
const API = {
    async guardarReporte(reporte) {
        if (!CONFIG.USE_GOOGLE_SHEETS || CONFIG.GOOGLE_SHEETS_URL === 'PEGA_TU_URL_AQUI') {
            const reportes = JSON.parse(localStorage.getItem('reportes_chmh') || '[]');
            reportes.push(reporte);
            localStorage.setItem('reportes_chmh', JSON.stringify(reportes));
            return { success: true };
        }
        try {
            await fetch(CONFIG.GOOGLE_SHEETS_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'guardar', reporte })
            });
            return { success: true };
        } catch(e) {
            const reportes = JSON.parse(localStorage.getItem('reportes_chmh') || '[]');
            reportes.push(reporte);
            localStorage.setItem('reportes_chmh', JSON.stringify(reportes));
            return { success: true };
        }
    },
    async obtenerReportes() {
        if (!CONFIG.USE_GOOGLE_SHEETS || CONFIG.GOOGLE_SHEETS_URL === 'PEGA_TU_URL_AQUI') {
            return JSON.parse(localStorage.getItem('reportes_chmh') || '[]');
        }
        try {
            const r = await fetch(CONFIG.GOOGLE_SHEETS_URL + '?action=obtener');
            const d = await r.json();
            return d.reportes || d.data || [];
        } catch(e) {
            return JSON.parse(localStorage.getItem('reportes_chmh') || '[]');
        }
    }
};

// ========== EVENTOS ==========
function attachEvents() {}

function goHome() {
    STATE.view = 'home';
    STATE.showLogin = false;
    render();
}

function goReporte() {
    STATE.view = 'reporte';
    STATE.search = '';
    STATE.searchResults = [];
    render();
}

function goAdmin() {
    if (STATE.isAuth) {
        STATE.view = 'admin';
        cargarReportes();
    } else {
        STATE.showLogin = true;
        render();
    }
}

function closeLoginModal() {
    STATE.showLogin = false;
    STATE.loginError = '';
    render();
}

function closeLogin(e) {
    if (e.target === e.currentTarget) closeLoginModal();
}

async function doLogin() {
    const u = (document.getElementById('login-user')?.value || STATE.loginUser).trim();
    const p = (document.getElementById('login-pass')?.value || STATE.loginPass).trim();
    if (!u || !p) { STATE.loginError = 'Ingresa usuario y contraseña.'; render(); return; }

    STATE.loginError = '';
    STATE.loginLoading = true;
    render();

    const res = await API_USUARIOS.login(u, p);

    STATE.loginLoading = false;
    if (res.success) {
        STATE.isAuth = true;
        STATE.currentUser = res.usuario;
        STATE.showLogin = false;
        STATE.loginUser = '';
        STATE.loginPass = '';
        STATE.view = 'admin';
        cargarReportes();
    } else {
        STATE.loginError = res.error || 'Usuario o contraseña incorrectos';
        render();
    }
}

function doSearch(val) {
    STATE.search = val;
    if (val.length < 2) {
        STATE.searchResults = [];
        renderSearchResults();
        return;
    }
    const q = val.toLowerCase();
    STATE.searchResults = CATALOGO_COMPLETO.filter(item =>
        item.descripcion.toLowerCase().includes(q) ||
        item.clave.toLowerCase().includes(q) ||
        (item.presentacion && item.presentacion.toLowerCase().includes(q))
    ).slice(0, 15);
    renderSearchResults();
}

function renderSearchResults() {
    const container = document.getElementById('search-results-container');
    if (!container) return;
    const results = STATE.searchResults;
    if (results.length === 0) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = `
        <div id="search-results" class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl">
            ${results.map((item, i) => `
            <div class="item-card p-3 cursor-pointer border-b border-gray-50 hover:bg-blue-50 transition-colors"
                onmousedown="addItem(${i})">
                <div class="flex items-start gap-2">
                    <span class="text-xs px-2 py-0.5 rounded-full font-medium mt-0.5 flex-shrink-0 ${item.tipo === 'medicamento' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}">${item.tipo === 'medicamento' ? 'Med' : 'Ins'}</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-gray-800">${item.descripcion.split('\\n')[0]}</div>
                        <div class="text-xs text-gray-400">${item.clave} · ${item.presentacion || ''}</div>
                    </div>
                </div>
            </div>`).join('')}
        </div>`;
}

function renderItemsYBoton() {
    // Actualizar lista de items sin re-renderizar todo el formulario
    const container = document.getElementById('items-container');
    const boton = document.getElementById('btn-enviar');
    
    if (container) {
        if (STATE.items.length === 0) {
            container.innerHTML = '';
        } else {
            container.innerHTML = `
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <h2 class="font-bold text-gray-700 mb-3">Insumos Reportados (${STATE.items.length})</h2>
                <div class="space-y-2">
                    ${STATE.items.map((item, i) => `
                    <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium text-gray-800">${item.descripcion.split('\\n')[0]}</div>
                            <div class="text-xs text-gray-400 mt-0.5">${item.clave} · ${item.tipo}</div>
                            <input type="text" placeholder="Observación (opcional)" value="${item.obs||''}"
                                class="mt-2 w-full text-xs border border-gray-200 rounded px-2 py-1"
                                oninput="STATE.items[${i}].obs=this.value">
                        </div>
                        <button onmousedown="removeItem(${i})" class="text-red-400 hover:text-red-600 text-lg flex-shrink-0">×</button>
                    </div>`).join('')}
                </div>
            </div>`;
        }
    }
    
    if (boton) {
        const habilitado = STATE.items.length > 0 && STATE.servicio;
        boton.className = `w-full bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-800 transition-all text-lg ${habilitado ? '' : 'opacity-50 cursor-not-allowed'}`;
    }
}

function addItem(idx) {
    const item = STATE.searchResults[idx];
    if (item && !STATE.items.find(i => i.clave === item.clave)) {
        STATE.items.push({...item, obs: ''});
    }
    // Limpiar búsqueda sin re-renderizar todo
    STATE.search = '';
    STATE.searchResults = [];
    const inp = document.getElementById('rp-search');
    if (inp) inp.value = '';
    const c = document.getElementById('search-results-container');
    if (c) c.innerHTML = '';
    renderItemsYBoton();
}

function removeItem(idx) {
    STATE.items.splice(idx, 1);
    renderItemsYBoton();
}

async function enviarReporte() {
    if (!STATE.servicio || STATE.items.length === 0) return;
    STATE.loading = true;
    render();
    
    const reporte = {
        id: Date.now().toString(),
        fecha: new Date(STATE.fecha).toISOString(),
        servicio: STATE.servicio,
        jefeServicio: STATE.jefe,
        totalItems: STATE.items.length,
        items: STATE.items.map(i => ({
            tipo: i.tipo,
            clave: i.clave,
            descripcion: i.descripcion.split('\n')[0],
            presentacion: i.presentacion || '',
            obs: i.obs || ''
        })),
        timestamp: new Date().toISOString()
    };

    try {
        await API.guardarReporte(reporte);
        // Resetear
        STATE.servicio = '';
        STATE.jefe = '';
        STATE.items = [];
        STATE.loading = false;
        STATE.view = 'home';
        alert('✅ Reporte enviado correctamente');
        render();
    } catch(e) {
        STATE.loading = false;
        alert('Error al enviar. Intenta de nuevo.');
        render();
    }
}

async function cargarReportes() {
    STATE.loading = true;
    render();
    try {
        STATE.reportes = await API.obtenerReportes();
    } catch(e) {
        STATE.reportes = [];
    }
    STATE.loading = false;
    render();
}

function setAdminTab(tab) {
    STATE.adminTab      = tab;
    STATE.cambioPassError = '';
    STATE.cambioPassOk  = '';
    STATE.nuevoError    = '';
    STATE.nuevoOk       = '';
    render();
    if (tab === 'usuarios' && STATE.currentUser?.rol === 'superadmin') {
        cargarListaUsuarios().then(() => render());
    }
}

async function cambiarContrasena() {
    const actual   = document.getElementById('cp-actual')?.value || STATE.cambioPassActual;
    const nueva    = document.getElementById('cp-nueva')?.value  || STATE.cambioPassNueva;
    const confirm  = document.getElementById('cp-confirm')?.value || STATE.cambioPassConfirm;

    STATE.cambioPassError = '';
    STATE.cambioPassOk    = '';

    if (!actual || !nueva || !confirm) { STATE.cambioPassError = 'Completa todos los campos.'; render(); return; }
    if (nueva.length < 4)              { STATE.cambioPassError = 'La contraseña debe tener al menos 4 caracteres.'; render(); return; }
    if (nueva !== confirm)             { STATE.cambioPassError = 'Las contraseñas nuevas no coinciden.'; render(); return; }

    const res = await API_USUARIOS.cambiarPass(STATE.currentUser.user, actual, nueva);
    if (res.success) {
        STATE.currentUser.pass = nueva;
        STATE.cambioPassOk     = '✅ Contraseña actualizada correctamente.';
        STATE.cambioPassActual = STATE.cambioPassNueva = STATE.cambioPassConfirm = '';
    } else {
        STATE.cambioPassError = res.error || 'Error al actualizar.';
    }
    render();
}

async function crearUsuario() {
    const user = (document.getElementById('nu-user')?.value || STATE.nuevoUser).trim();
    const pass = (document.getElementById('nu-pass')?.value || STATE.nuevoPass).trim();
    STATE.nuevoError = '';
    STATE.nuevoOk    = '';

    if (!user || !pass)  { STATE.nuevoError = 'Completa usuario y contraseña.'; render(); return; }
    if (pass.length < 4) { STATE.nuevoError = 'La contraseña debe tener al menos 4 caracteres.'; render(); return; }

    const res = await API_USUARIOS.crear(STATE.currentUser.user, user, pass);
    if (res.success) {
        STATE.nuevoOk   = `✅ Usuario "${user}" creado.`;
        STATE.nuevoUser = '';
        STATE.nuevoPass = '';
        await cargarListaUsuarios();
    } else {
        STATE.nuevoError = res.error || 'Error al crear usuario.';
    }
    render();
}

async function eliminarUsuario(targetUser) {
    if (!confirm(`¿Eliminar al usuario "${targetUser}"?`)) return;
    const res = await API_USUARIOS.eliminar(STATE.currentUser.user, targetUser);
    if (res.success) await cargarListaUsuarios();
    else alert(res.error || 'Error al eliminar.');
    render();
}

async function cargarListaUsuarios() {
    STATE.usuariosLoading = true;
    render();
    const res = await API_USUARIOS.obtener(STATE.currentUser.user);
    STATE.usuarios        = res.success ? res.usuarios : [];
    STATE.usuariosLoading = false;
}

function recargar() {
    cargarReportes();
}

function toggleReporte(i) {
    STATE.selected = STATE.selected === i ? null : i;
    render();
}

function getReportesFiltrados() {
    let lista = STATE.reportes;
    if (STATE.filtroServicio !== 'todos') lista = lista.filter(r => r.servicio === STATE.filtroServicio);
    if (STATE.filtroFechaDesde) lista = lista.filter(r => {
        const f = r.fecha ? new Date(r.fecha).toISOString().split('T')[0] : '';
        return f >= STATE.filtroFechaDesde;
    });
    if (STATE.filtroFechaHasta) lista = lista.filter(r => {
        const f = r.fecha ? new Date(r.fecha).toISOString().split('T')[0] : '';
        return f <= STATE.filtroFechaHasta;
    });
    return lista;
}

function limpiarFiltros() {
    STATE.filtroServicio   = 'todos';
    STATE.filtroFechaDesde = '';
    STATE.filtroFechaHasta = '';
    render();
}

function exportarHoyPDF() {
    const hoy = new Date().toISOString().split('T')[0];
    STATE.filtroFechaDesde = hoy;
    STATE.filtroFechaHasta = hoy;
    STATE.filtroServicio   = 'todos';
    render();
    setTimeout(() => exportarPDF(), 100);
}

function exportarPDF() {
    const { jsPDF } = window.jspdf;
    const doc       = new jsPDF({ orientation: 'landscape' });
    const reportes  = getReportesFiltrados();

    if (reportes.length === 0) { alert('No hay reportes con los filtros seleccionados.'); return; }

    // Título
    doc.setFontSize(16);
    doc.setTextColor(30, 64, 175);
    doc.text('Reporte de Faltantes - CHMH', 14, 18);
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);

    let subtitulo = 'Generado: ' + new Date().toLocaleString('es-MX');
    if (STATE.filtroFechaDesde || STATE.filtroFechaHasta)
        subtitulo += `  |  Período: ${STATE.filtroFechaDesde || '—'} al ${STATE.filtroFechaHasta || '—'}`;
    if (STATE.filtroServicio !== 'todos')
        subtitulo += `  |  Servicio: ${STATE.filtroServicio}`;
    doc.text(subtitulo, 14, 25);

    // Tabla consolidada — un item por fila
    const rows = [];
    reportes.forEach(r => {
        const fecha = r.fecha ? new Date(r.fecha).toLocaleDateString('es-MX') : '';
        (r.items || []).forEach(item => {
            rows.push([
                fecha,
                r.servicio || '',
                r.jefeServicio || '',
                item.clave || '',
                (item.descripcion || '').split('\n')[0].substring(0, 70),
                item.tipo === 'medicamento' ? 'Medicamento' : 'Insumo',
                item.obs || ''
            ]);
        });
    });

    doc.autoTable({
        head: [['Fecha', 'Servicio', 'Jefe', 'Clave', 'Descripción', 'Tipo', 'Observación']],
        body: rows,
        startY: 30,
        styles:     { fontSize: 7, cellPadding: 2 },
        headStyles: { fillColor: [30, 64, 175], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [240, 245, 255] },
        columnStyles: {
            0: { cellWidth: 22 },
            1: { cellWidth: 38 },
            2: { cellWidth: 30 },
            3: { cellWidth: 32 },
            4: { cellWidth: 80 },
            5: { cellWidth: 24 },
            6: { cellWidth: 30 }
        }
    });

    // Pie de página
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(7);
        doc.setTextColor(150);
        doc.text(`Página ${i} de ${pageCount}  |  CHMH Control de Faltantes`, 14, doc.internal.pageSize.height - 8);
    }

    const fecha = new Date().toISOString().split('T')[0];
    doc.save(`faltantes-chmh-${fecha}.pdf`);
}

function exportarExcel() {
    const reportes = getReportesFiltrados();
    if (reportes.length === 0) { alert('No hay reportes con los filtros seleccionados.'); return; }

    // Construir CSV con BOM para que Excel abra bien con acentos
    const BOM = '\uFEFF';
    const cols = ['Fecha', 'Servicio', 'Jefe de Servicio', 'Clave', 'Descripción', 'Presentación', 'Tipo', 'Observación'];
    const escape = v => `"${String(v).replace(/"/g, '""')}"`;

    let csv = BOM + cols.map(escape).join(',') + '\n';
    reportes.forEach(r => {
        const fecha = r.fecha ? new Date(r.fecha).toLocaleDateString('es-MX') : '';
        (r.items || []).forEach(item => {
            csv += [
                fecha,
                r.servicio || '',
                r.jefeServicio || '',
                item.clave || '',
                (item.descripcion || '').split('\n')[0],
                item.presentacion || '',
                item.tipo === 'medicamento' ? 'Medicamento' : 'Insumo',
                item.obs || ''
            ].map(escape).join(',') + '\n';
        });
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `faltantes-chmh-${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// ========== INIT ==========
render();
</script>
</body>
</html>
